<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=3" />
    <link rel="shortcut icon" href="/logo.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurante Amaranto — Cocina de Autor</title>
    <meta name="description" content="Restaurante Amaranto: alta gastronomía contemporánea, maridaje de autor, ingredientes de temporada y reservas en línea." />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Aplica el tema guardado antes de pintar, para que no parpadee al cargar.
      try {
        if (localStorage.getItem('restaurante-tema') === 'oscuro') {
          document.documentElement.dataset.tema = 'oscuro'
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
